<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter Signup Modal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <div class="newsletter-icon">✉️</div>
        <h1>Stay in the Loop!</h1>
        <p>
            Subscribe to our newsletter and receive the latest
            updates, tips, and exclusive offers directly in your inbox.
        </p>
        <button id="openModal" class="subscribe-btn">
            Subscribe Now
        </button>
    </main>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" role="dialog" aria-modal="true"
             aria-labelledby="modalTitle">

            <button class="close-btn" id="closeModal"
                    aria-label="Close modal">&times;</button>

            <div class="modal-icon">📩</div>

            <h2 id="modalTitle">Join Our Newsletter</h2>

            <p>Get the latest updates delivered straight to your inbox.</p>

            <form id="newsletterForm">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >

                <button type="submit" class="submit-btn">
                    Subscribe
                </button>

                <p class="message" id="message" aria-live="polite"></p>
            </form>

            <small>We respect your privacy. Unsubscribe anytime.</small>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
